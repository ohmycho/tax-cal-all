<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard Variable', 'Pretendard', sans-serif;
  background: #F2F4F6;
  color: #191F28;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.screen {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: #F2F4F6;
  display: flex;
  flex-direction: column;
}
.top-bar {
  position: sticky; top: 0; z-index: 10;
  background: #F2F4F6;
  padding: 16px 20px 8px;
  display: flex; align-items: center; gap: 8px;
}
.back-btn {
  width: 36px; height: 36px; border: none; background: none; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  border-radius: 50%; color: #191F28; flex-shrink: 0;
}
.back-btn:hover { background: #E5E8EB; }
.back-btn svg { display: block; }
.top-title {
  font-size: 15px; font-weight: 600; color: #191F28; display: none; flex: 1;
}
.home-btn {
  width: 36px; height: 36px; border: none; background: none; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  border-radius: 50%; margin-left: auto; flex-shrink: 0;
}
.home-btn:hover { background: #E5E8EB; }
.home-btn svg { display: block; }
.progress-wrap { padding: 0 20px 4px; display: none; }
.progress-track { height: 3px; background: #E5E8EB; border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: #3182F6; border-radius: 2px; transition: width 0.35s cubic-bezier(.4,0,.2,1); }
.content { flex: 1; padding: 8px 20px 110px; }

/* 홈 */
.home-header { padding: 20px 0 28px; }
.home-eyebrow { font-size: 13px; color: #8B95A1; margin-bottom: 8px; font-weight: 500; }
.home-title { font-size: 26px; font-weight: 700; color: #191F28; line-height: 1.35; margin-bottom: 8px; letter-spacing: -0.5px; }
.home-sub { font-size: 14px; color: #8B95A1; line-height: 1.6; }
.type-list { display: flex; flex-direction: column; gap: 10px; }
.type-card {
  background: #fff; border-radius: 16px; padding: 20px;
  cursor: pointer; border: 2px solid transparent;
  transition: border-color 0.15s, transform 0.1s;
  display: flex; align-items: center; gap: 16px;
  text-align: left; width: 100%;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.type-card:active { transform: scale(0.99); }
.type-card.selected { border-color: #3182F6; }
.type-icon-wrap {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.type-icon-wrap.blue { background: #e8f3ff; }
.type-icon-wrap.green { background: #f0faf6; }
.type-icon-wrap.pink { background: #f9fafb; }
.type-icon-wrap.yellow { background: #fff9e7; }
.type-info { flex: 1; }
.type-name { font-size: 16px; font-weight: 700; color: #191F28; margin-bottom: 3px; letter-spacing: -0.3px; }
.type-desc { font-size: 13px; color: #8B95A1; line-height: 1.5; }
.type-arrow { color: #d1d6db; flex-shrink: 0; }

/* 질문 */
.q-screen { display: none; }
.q-header { padding: 8px 0 28px; }
.q-step-label { font-size: 13px; color: #3182F6; font-weight: 600; margin-bottom: 10px; }
.q-title { font-size: 22px; font-weight: 700; color: #191F28; line-height: 1.4; white-space: pre-line; letter-spacing: -0.4px; }
.q-note-card {
  background: #F2F4F6; border-radius: 12px; padding: 14px 16px; margin-top: 16px;
  font-size: 13px; color: #4E5968; line-height: 1.7; display: none;
}
.nc-single { font-size: 13px; color: #4E5968; line-height: 1.7; }
.nc-bullet-item { font-size: 13px; color: #4E5968; line-height: 1.6; padding-left: 14px; position: relative; margin-bottom: 6px; }
.nc-bullet-item:last-child { margin-bottom: 0; }
.nc-bullet-item::before { content: '•'; position: absolute; left: 1px; color: #3182F6; font-weight:700; }
.nc-intro { font-size: 13px; color: #4E5968; margin-bottom: 10px; }
.nc-case { margin-bottom: 10px; }
.nc-case:last-child { margin-bottom: 0; }
.nc-case-title { font-size: 13px; font-weight: 700; color: #191F28; margin-bottom: 3px; }
.nc-case-desc { font-size: 12px; color: #8B95A1; line-height: 1.6; padding-left: 4px; }
.q-options { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
.q-opt {
  background: #fff; border: 2px solid #E5E8EB; border-radius: 14px;
  padding: 18px 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: border-color 0.12s, background 0.12s, transform 0.1s;
  font-size: 16px; font-weight: 600; color: #191F28; width: 100%; text-align: left;
}
.q-opt:active { transform: scale(0.99); }
.q-opt.yes-sel { border-color: #3182F6; background: #e8f3ff; color: #3182F6; }
.q-opt.no-sel { border-color: #f04452; background: #f9fafb; color: #f04452; }
.q-opt-check {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid #E5E8EB;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all 0.12s;
}
.yes-sel .q-opt-check { background: #3182F6; border-color: #3182F6; }
.no-sel .q-opt-check { background: #f04452; border-color: #f04452; }

/* 결과 */
.result-screen { display: none; }
.result-hero { padding: 32px 0 28px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.result-icon-wrap {
  width: 72px; height: 72px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
}
.result-icon-wrap.pass { background: #f0faf6; }
.result-icon-wrap.fail { background: #f9fafb; }

  font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px;
  display: inline-block; margin-bottom: 12px; letter-spacing: 0.02em;
}
.result-badge.pass { background: #f0faf6; color: #03b26c; }
.result-badge.fail { background: #f9fafb; color: #f04452; }
.result-headline {
  font-size: 24px; font-weight: 700; color: #191F28;
  line-height: 1.4; margin-bottom: 8px; letter-spacing: -0.5px; white-space: pre-line;
}
.result-sub { font-size: 15px; color: #8B95A1; line-height: 1.6; }

.result-card {
  background: #fff; border-radius: 16px; padding: 20px;
  margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.rc-label { font-size: 11px; font-weight: 700; color: #8B95A1; margin-bottom: 12px; letter-spacing: 0.05em; }
.rc-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid #F2F4F6; font-size: 14px;
}
.rc-row:last-child { border-bottom: none; padding-bottom: 0; }
.rc-icon { flex-shrink: 0; margin-top: 2px; }
.rc-text { color: #4E5968; line-height: 1.55; flex: 1; }

.notice-card { background: #F2F4F6; border-radius: 16px; padding: 18px 20px; margin-bottom: 10px; }
.nc-title { font-size: 13px; font-weight: 700; color: #4E5968; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.nc-body { font-size: 13px; color: #4E5968; line-height: 1.7; }
.nc-bullet { padding-left: 16px; position: relative; margin-bottom: 6px; color: #4E5968; }

/* 하단 CTA */
.bottom-cta {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);

.cta-btn {
  width: 100%; padding: 17px; border: none; border-radius: 15px;

.cta-btn.primary { background: #3182F6; color: #fff; }
.cta-btn.secondary { background: #E5E8EB; color: #4E5968; }

<style id="tds-base">

<script>
/* 아이폰은 글자 16px 미만 입력창을 누르면 화면을 확대하고, 확대가 그대로 남아 레이아웃이 깨진다.
   16px보다 작은 입력창만 16px로 올린다 (큰 금액 입력창은 그대로). 나중에 생기는 입력창(AI 채팅 등)도 처리. */
(function(){
  var SEL='input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=hidden]),select,textarea';
  function fix(root){
    if(!root||!root.querySelectorAll) return;
    var list=root.matches&&root.matches(SEL)?[root]:[];
    list=list.concat([].slice.call(root.querySelectorAll(SEL)));
    list.forEach(function(el){ if(parseFloat(getComputedStyle(el).fontSize)<16) el.style.setProperty('font-size','16px','important'); });
  }
  function start(){
    fix(document);
    new MutationObserver(function(ms){ ms.forEach(function(m){ [].forEach.call(m.addedNodes,function(n){ if(n.nodeType===1) fix(n); }); }); })
      .observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  /* 혹시 확대된 상태로 남으면 입력이 끝날 때 원래 배율로 되돌린다 */
  document.addEventListener('focusout',function(e){
    if(!e.target.matches||!e.target.matches(SEL)) return;
    var vp=document.querySelector('meta[name=viewport]'); if(!vp||!window.visualViewport||visualViewport.scale<=1.01) return;
    var c=vp.content; vp.content=c+', maximum-scale=1'; setTimeout(function(){ vp.content=c; },300);
  });
})();
</script>

<script>
/* 계산 단계 옆에 붙이는 법령 근거. 사용: lawRef('소득세법 제104조①1호') */
/* 브라우저 alert 대신 토스식 토스트 (alert는 앱 안 iframe에서 화면을 멈추게 함) */
function tdsToast(msg){
  var el=document.getElementById('tds-toast');
  if(!el){ el=document.createElement('div'); el.id='tds-toast';
    el.style.cssText='position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 40px);width:max-content;background:rgba(25,31,40,.92);color:#fff;font-size:15px;font-weight:500;line-height:1.5;padding:13px 20px;border-radius:14px;z-index:99999;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;word-break:keep-all';
    document.body.appendChild(el); }
  el.textContent=String(msg); el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(function(){ el.style.opacity='0'; },2400);
}
function lawRef(t, inline){ return t ? '<span class="law-ref'+(inline?' inline':'')+'">'+t+'</span>' : ''; }
</script>

<script id="tds-wizard-js">
/* 토스식 질문 넘기기 엔진

   - money: unit:'만원'|'원' (값은 그 단위의 숫자) / number: unit, max / multi: fields:[{id,label,unit,max}]
   - date: 'YYYY-MM-DD' / search: suggest(q) → 문자열 배열
   - when(a): false면 건너뜀 / validate(v,a): 오류 문구 / optional: 비워도 다음 / help: 회색 안내 */
window.TAX_CAL_VERSION = { version:'v1.6', date:'2026.11.17', lawDate:'2026.11.16' };
window.tdsVersionText = function(long){
  var v=window.TAX_CAL_VERSION; return long ? ('계산기 '+v.version+' · '+v.date+' 배포 · 세법 기준일 '+v.lawDate) : v.version;
};
/* 모든 페이지 맨 아래 버전 줄 + data-tds-version 자리에 버전 글자 */
document.addEventListener('DOMContentLoaded', function(){
  document.querySelectorAll('[data-tds-version]').forEach(function(el){
    var m=el.getAttribute('data-tds-version'), v=window.TAX_CAL_VERSION;
    el.textContent = m==='meta' ? (v.date+' 배포 · 세법 기준일 '+v.lawDate) : tdsVersionText(m==='long');
  });
  if(!document.querySelector('.tds-ver-foot')){ var f=document.createElement('div'); f.className='tds-ver-foot'; f.textContent=tdsVersionText(true); document.body.appendChild(f); }
});
(function(){
  var ICON_BACK='<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>';
  var ICON_CK='<svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17 19 7"/></svg>';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function kor(n, unit){
    n=Number(n)||0; if(n<=0) return '';
    var won = unit==='만원' ? n*10000 : n;
    var jo=Math.floor(won/1e12), eok=Math.floor(won%1e12/1e8), man=Math.floor(won%1e8/1e4), rest=Math.round(won%1e4), out=[];
    if(jo) out.push(jo.toLocaleString()+'조'); if(eok) out.push(eok.toLocaleString()+'억'); if(man) out.push(man.toLocaleString()+'만');
    if(!out.length || (rest && unit!=='만원')) out.push((rest||0).toLocaleString());
    return out.join(' ')+' 원';
  }
  function digits(s){ return String(s||'').replace(/[^0-9]/g,''); }
  /* 햅틱: 안드로이드는 진동 API, 아이폰(Safari 18+)은 switch 체크박스를 누르는 방식으로 짧은 진동 */

    try{
      if(navigator.vibrate){ navigator.vibrate(8); return; }

        hapticEl.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none';
        var c=document.createElement('input'); c.type='checkbox'; c.setAttribute('switch',''); c.tabIndex=-1; hapticEl.appendChild(c); document.body.appendChild(hapticEl); }
      hapticEl.click();
    }catch(e){}
  }
  window.tdsHaptic = haptic;
  /* 결과 금액이 0부터 올라가는 애니메이션 (토스식). 글자 안 첫 숫자만 움직이고 단위는 그대로 */
  window.tdsCountUp = function(el, ms){
    if(!el || el.dataset.counted) return; var txt=el.textContent, m=txt.match(/[\d,]+(\.\d+)?/); if(!m) return;
    var target=parseFloat(m[0].replace(/,/g,'')); if(!(target>0)) return;
    var dec=(m[1]||'').length? m[1].length-1 : 0, pre=txt.slice(0,m.index), post=txt.slice(m.index+m[0].length), t0=null; ms=ms||700;
    el.dataset.counted='1';
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    function fmt(v){ return v.toLocaleString('ko-KR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
    function step(ts){ if(!t0) t0=ts; var k=Math.min(1,(ts-t0)/ms), e=1-Math.pow(1-k,3);
      el.textContent=pre+fmt(k<1?target*e:target)+post; if(k<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  };
  var COUNT_SEL='.result-total-num,.result-amount,.result-total,.sc-amount,#r-total,#totalTax,#resFinal';
  window.tdsKor = kor;

  window.TDSWizard = function(cfg){
    var a = Object.assign({}, cfg.init||{}), hist=[], idx=0;
    /* 중복 진행 방지: 한 질문에서 넘어가는 동작은 한 번만. 다음 질문이 그려질 때 풀린다 */
    var locked=false, tapLockUntil=0;
    /* 넘기는 탭 직후 350ms는 다음 탭을 무시 → 빠른 두 번 탭이 새 질문의 선택지·버튼에 떨어져도 건너뛰지 않음 */
    function tapOK(){ var t=Date.now(); if(t<tapLockUntil) return false; tapLockUntil=t+350; return true; }
    var root=document.createElement('div'); root.className='tds-wiz'; root.id='tds-wiz';
    root.innerHTML='<div class="tds-topbar"><button class="tds-back" aria-label="뒤로">'+ICON_BACK+'</button><div class="tds-topbar-title">'+esc(cfg.title)+'</div><span class="tds-ver-badge">'+tdsVersionText()+'</span></div>'+
      '<div class="tds-progress"><i></i></div><div class="tds-wiz-body"></div>'+
      '<div class="tds-cta-bar"><div><button class="tds-btn" id="tds-next">다음</button></div></div>';
    document.body.appendChild(root); document.documentElement.classList.add('tds-wiz-on');
    var body=root.querySelector('.tds-wiz-body'), bar=root.querySelector('.tds-cta-bar'), next=root.querySelector('#tds-next'), back=root.querySelector('.tds-back');
    var steps=cfg.steps;
    function visible(i){ var s=steps[i]; return !s.when || s.when(a); }
    function nextIdx(i){ for(var j=i+1;j<steps.length;j++) if(visible(j)) return j; return -1; }
    function countVisible(){ var n=0,pos=0; for(var j=0;j<steps.length;j++){ if(visible(j)){ n++; if(j<=idx) pos=n; } } return [pos,n]; }
    function err(msg){ var e=body.querySelector('.tds-err'); if(e) e.textContent=msg||''; var w=body.querySelector('.tds-input-wrap'); if(w) w.classList.toggle('err',!!msg); }
    function value(s){
      if(s.type==='multi'){ var o={}; s.fields.forEach(function(f){ o[f.id]=Number(digits(body.querySelector('[data-f="'+f.id+'"]').value))||0; }); return o; }
      var el=body.querySelector('.tds-input'); if(!el) return a[s.id];
      if(s.type==='money'||s.type==='number') return el.value===''?null:Number(digits(el.value));
      return el.value.trim();
    }
    function empty(s,v){ if(s.type==='multi') return false; return v===null||v===undefined||v===''; }
    function go(){
      if(locked) return;
      var s=steps[idx], v=value(s);
      if(s.type!=='choice'){
        if(empty(s,v) && !s.optional){ err(s.type==='date'?'날짜를 선택해 주세요':'값을 입력해 주세요'); return; }
        if(s.validate){ var m=s.validate(v,a); if(m){ err(m); return; } }
        a[s.id]=empty(s,v)?(s.type==='money'||s.type==='number'?null:''):v; /* 비운 칸은 null, 입력한 0은 0 */
        if(s.type==='multi') s.fields.forEach(function(f){ a[f.id]=v[f.id]; });

      hist.push(idx); idx=n; render();
    }
    function finish(){
      root.remove(); document.documentElement.classList.remove('tds-wiz-on'); window.scrollTo(0,0);
      cfg.onDone(a); haptic();
      setTimeout(function(){ document.querySelectorAll(COUNT_SEL).forEach(function(el){ delete el.dataset.counted; if(el.offsetParent) tdsCountUp(el); }); }, 30);
    }
    function render(){
      var s=steps[idx], c=countVisible(); err(''); locked=false;
      root.querySelector('.tds-progress i').style.width=Math.round(c[0]/c[1]*100)+'%';
      back.classList.toggle('home', hist.length===0);
      var h='<div class="tds-step-count">'+c[0]+' / '+c[1]+'</div><h2 class="tds-q">'+esc(typeof s.q==='function'?s.q(a):s.q)+'</h2><p class="tds-q-sub">'+esc(typeof s.sub==='function'?s.sub(a):(s.sub||''))+'</p><div class="tds-control">';
      var cur=a[s.id];
      if(s.type==='choice'){
        h+='<div class="tds-choices'+(s.row?' row':'')+'">'+s.options.filter(function(o){return !o.when||o.when(a);}).map(function(o){
          return '<button class="tds-choice'+(cur===o.v?' on':'')+'" data-v="'+esc(o.v)+'"><span><span class="t">'+esc(o.l)+'</span>'+(o.d?'<span class="d">'+esc(o.d)+'</span>':'')+'</span><span class="ck">'+ICON_CK+'</span></button>';
        }).join('')+'</div>';
      } else if(s.type==='multi'){
        h+='<div class="tds-multi">'+s.fields.map(function(f){ var v=a[f.id];
          return '<div><div class="tds-input-wrap"><input class="tds-input" data-f="'+f.id+'" inputmode="numeric" placeholder="0" value="'+(v||v===0?v:'')+'"><span class="tds-unit">'+esc(f.unit||'')+'</span></div></div>'; }).join('')+'</div>';
      } else {
        var type = s.type==='date'?'date':'text', im = (s.type==='money'||s.type==='number')?' inputmode="numeric"':'';
        var val = cur==null||cur===''?'':(s.type==='money'?Number(cur).toLocaleString():cur);
        var numeric = s.type==='money'||s.type==='number';
        var field='<input class="tds-input" type="'+type+'"'+im+' autocomplete="off" enterkeyhint="next" placeholder="'+esc(s.placeholder||(s.type==='money'?'0':''))+'" value="'+esc(val)+'"'+(s.max?' max="'+s.max+'"':'')+'>';
        h+='<div class="tds-input-wrap">'+(numeric?'<div class="tds-num">'+field+'<div class="tds-num-view"></div></div>':field)+(s.unit?'<span class="tds-unit">'+esc(s.unit)+'</span>':'')+'</div>';
        if(s.type==='money') h+='<div class="tds-hint"></div>';
        if(s.type==='search') h+='<div class="tds-suggest"></div>';
      }
      h+='<div class="tds-err"></div>'+(s.help?'<div class="tds-help">'+esc(typeof s.help==='function'?s.help(a):s.help)+'</div>':'')+'</div>';
      body.innerHTML=h; body.scrollTop=0;
      bar.style.display = s.type==='choice' ? 'none' : '';
      next.textContent = nextIdx(idx)<0 ? (cfg.doneLabel||'결과 보기') : '다음';
      if(s.type==='choice'){
        var picked=false;
        body.querySelectorAll('.tds-choice').forEach(function(b){ b.onclick=function(){
          if(picked||locked||!tapOK()) return; picked=true;
          haptic(); body.querySelectorAll('.tds-choice').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
          var raw=b.getAttribute('data-v'), o=s.options.find(function(x){return String(x.v)===raw;}); a[s.id]=o?o.v:raw;
          setTimeout(go,160);
        }; });
        return;
      }
      var inp=body.querySelector('.tds-input');
      if(s.type==='money'){
        var hint=body.querySelector('.tds-hint');
        var upd=function(){ var d=digits(inp.value); inp.value=d?Number(d).toLocaleString():''; hint.textContent=kor(d,s.unit); };
        inp.addEventListener('input',upd); upd();
      }
      var view=body.querySelector('.tds-num-view');
      if(view){
        var prev=inp.value;
        var paint=function(grow){ var t=inp.value; view.innerHTML=t.split('').map(function(ch,i){ return '<i'+(grow&&i===t.length-1?' class="pop"':'')+'>'+esc(ch)+'</i>'; }).join(''); };
        inp.addEventListener('input',function(){ var grow=digits(inp.value).length>digits(prev).length; if(grow||inp.value!==prev) haptic(); paint(grow); prev=inp.value; refresh(); });

      body.querySelectorAll('.tds-input').forEach(function(el){ el.addEventListener('input',refresh); });
      refresh();
      /* 날짜는 고르면 바로 다음으로 (토스처럼). 아이폰은 날짜 창의 '완료'를 누르면 넘어감 */

      }

    back.onclick=function(){

      if(cfg.onExit) cfg.onExit(); else if(window.self===window.top) location.href='index.html';
    };
    function lift(){ if(!window.visualViewport) return; var off=Math.max(0, window.innerHeight-visualViewport.height-visualViewport.offsetTop); bar.style.transform=off>0?'translateY('+(-off)+'px)':''; }
    if(window.visualViewport){ visualViewport.addEventListener('resize',lift); visualViewport.addEventListener('scroll',lift); }
    render();
    return { answers:a, restart:function(){ window.TDSWizard(cfg); } };
  };

  /* AI 상담: 서버(/api/chat)에 묻고 답 글자만 돌려준다. 실패하면 사용자에게 보여 줄 안내 문구. */
  window.tdsAskAI = function(kind, context, messages){
    return fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ kind: kind, context: String(context||'').slice(0,3000), messages: messages.slice(-10) }) })
      .then(function(r){
        if(r.status===429) return '질문이 너무 많아요. 1분 뒤에 다시 물어봐 주세요.';
        if(!r.ok) return '지금은 답을 드리기 어려워요. 잠시 후 다시 시도해 주세요.';
        return r.json().then(function(d){ return d.text || '답을 만들지 못했어요. 다시 물어봐 주세요.'; });
      }).catch(function(){ return '네트워크 오류가 났어요. 잠시 후 다시 시도해 주세요.'; });
  };
  /* 채팅 말풍선: 글자를 HTML로 해석하지 않음 (XSS 방지) */
  window.tdsBubble = function(cls, text){
    var b=document.createElement('div'); b.className=cls; b.style.whiteSpace='pre-wrap'; b.textContent=String(text==null?'':text); return b;

  window.tdsSubmitConsult = function(data){

  const q = qs[curQIdx];
  const curAnswers = inExtra ? extraAnswers : answers;
  const allTotal = cfg.qs.length + (cfg.extraQs ? cfg.extraQs.length : 0);
  const doneCount = (inExtra ? cfg.qs.length : 0) + curQIdx;
  document.getElementById('progressFill').style.width = (doneCount / allTotal * 100) + '%';
  document.getElementById('qStepLabel').textContent = doneCount + 1 + ' / ' + allTotal;
  document.getElementById('qTitle').textContent = q.title;
  const noteCard = document.getElementById('qNote');
  if (q.note) {
    noteCard.style.display = 'block';
    if (q.noteType === 'cases') {
      const lines = q.note.split('\n');
      const intro = lines[0];
      const items = lines.slice(1).map(function(line) {
        const parts = line.split('|');
        const title = parts[0];
        const desc = parts[1] || '';
        return '<div class="nc-case">'
          + '<div class="nc-case-title">' + title + '</div>'
          + (desc ? '<div class="nc-case-desc">' + desc + '</div>' : '')
          + '</div>';
      }).join('');
      document.getElementById('qNoteText').innerHTML = '<div class="nc-intro">' + intro + '</div>' + items;
    } else {
      const lines = q.note.split('\n').filter(function(l) { return l.trim(); });
      const html = lines.length === 1
        ? '<div class="nc-single">' + lines[0] + '</div>'
        : lines.map(function(l) { return '<div class="nc-bullet-item">' + l + '</div>'; }).join('');
      document.getElementById('qNoteText').innerHTML = html;
    }
  } else {
    noteCard.style.display = 'none';
  }
  const ans = curAnswers[curQIdx];
  document.getElementById('optYes').className = 'q-opt' + (ans === 'yes' ? ' yes-sel' : '');
  document.getElementById('optNo').className = 'q-opt' + (ans === 'no' ? ' no-sel' : '');
  if (ans) {
    document.getElementById('bottomCta').style.display = 'block';
    updateCtaForAnswer(ans, q);
  } else {
    document.getElementById('bottomCta').style.display = 'none';
  }
}
function answer(val) {
  const cfg = TYPES[curType];
  const curAnswers = inExtra ? extraAnswers : answers;
  curAnswers[curQIdx] = val;
  const q = getCurQs()[curQIdx];
  document.getElementById('optYes').className = 'q-opt' + (val === 'yes' ? ' yes-sel' : '');
  document.getElementById('optNo').className = 'q-opt' + (val === 'no' ? ' no-sel' : '');
  document.getElementById('bottomCta').style.display = 'block';
  updateCtaForAnswer(val, q);
}
function updateCtaForAnswer(val, q) {
  const cfg = TYPES[curType];
  const btn = document.getElementById('ctaBtn');
  btn.className = 'cta-btn primary';
  if (val === 'no') {
    btn.textContent = '결과 확인하기';
    btn.onclick = () => showResult('fail');
    return;
  }
  if (q.branch && val === 'yes' && q.branch.yes === 'done') {
    btn.textContent = '결과 확인하기';
    btn.onclick = () => showResult('pass');
    return;
  }
  const qs = getCurQs();
  const isLastQ = curQIdx === qs.length - 1;
  const isLastExtra = inExtra && curQIdx === cfg.extraQs.length - 1;
  if (isLastExtra || (isLastQ && !q.branch && !inExtra && !cfg.extraQs)) {
    btn.textContent = '결과 확인하기';
    btn.onclick = () => showResult('pass');
  } else if (isLastQ && !q.branch && !inExtra && cfg.extraQs) {
    btn.textContent = '결과 확인하기';
    btn.onclick = () => showResult('pass');
  } else {
    btn.textContent = '다음';
    btn.onclick = ctaNext;
  }
}
function ctaNext() {
  const cfg = TYPES[curType];
  const curAnswers = inExtra ? extraAnswers : answers;
  const val = curAnswers[curQIdx];
  if (!val) return;
  const q = getCurQs()[curQIdx];
  if (val === 'no') { showResult('fail'); return; }
  if (q.branch && val === 'no' && q.branch.no === 'extra') {
    inExtra = true; curQIdx = 0; renderQ(); return;
  }
  if (q.branch && val === 'yes' && q.branch.yes === 'done') {
    showResult('pass'); return;
  }
  const qs = getCurQs();
  if (curQIdx < qs.length - 1) { curQIdx++; renderQ(); }
  else showResult('pass');
}
function showResult(type) {
  document.getElementById('qScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('qStepLabel').textContent = '';
  const cfg = TYPES[curType];
  const wrap = document.getElementById('resultIconWrap');
  const svg = document.getElementById('resultIconSvg');
  if (type === 'pass') {
    wrap.className = 'result-icon-wrap pass';
    svg.innerHTML = '<circle cx="18" cy="18" r="18" fill="#f0faf6"/><path d="M10 18L15.5 23.5L26 12.5" stroke="#03b26c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
    document.getElementById('resultBadge').className = 'result-badge pass';
    document.getElementById('resultBadge').textContent = '비과세 해당';
    document.getElementById('resultHeadline').textContent = '비과세 혜택을\n받을 수 있어요';
    document.getElementById('resultSub').textContent = '요건을 모두 충족했어요';
    let html = '<div class="result-card"><div class="rc-label">충족한 요건</div>';
    cfg.passCards.forEach((t, i) => {
      const law = (cfg.passLaws || [])[i];
      html += `<div class="rc-row">
        <span class="rc-icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="9" fill="#f0faf6"/><path d="M5.5 9L7.8 11.3L12.5 6.5" stroke="#03b26c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="rc-text">${t}${lawRef(law)}</span>
      </div>`;
    });
    html += '</div>';
    const noticeHtml = cfg.notice.split('\n').map(function(line) {
      if (line.startsWith('*')) return '<div class="nc-bullet">' + line.slice(1).trim() + '</div>';
      if (line) return '<div class="nc-plain">' + line + '</div>';
      return '';
    }).join('');
    html += '<div class="notice-card">'
      + '<div class="nc-title"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7.5" stroke="#8B95A1" stroke-width="1.2"/><path d="M8 7V11" stroke="#8B95A1" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="5" r="0.8" fill="#8B95A1"/></svg> 꼭 확인하세요</div>'
      + '<div class="nc-body">' + noticeHtml + lawRef('12억 초과분 과세: 소득세법 제89조①3호 · 제95조③ · 시행령 제160조①') + '</div>'
      + '</div>';
    document.getElementById('resultCards').innerHTML = html;
  } else {
    wrap.className = 'result-icon-wrap fail';
    svg.innerHTML = '<circle cx="18" cy="18" r="18" fill="#f9fafb"/><path d="M12 12L24 24M24 12L12 24" stroke="#f04452" stroke-width="2.2" stroke-linecap="round"/>';
    document.getElementById('resultBadge').className = 'result-badge fail';
    document.getElementById('resultBadge').textContent = '과세 대상';
    document.getElementById('resultHeadline').textContent = '아쉽지만\n과세 대상이에요';
    document.getElementById('resultSub').textContent = '요건 중 하나를 충족하지 못했어요';
    document.getElementById('resultCards').innerHTML = `
      <div class="fail-card">
        <div class="fail-card-title">비과세 혜택을 받으려면</div>
        <div class="fail-card-body">모든 요건을 충족해야 비과세 혜택이 적용돼요. 정확한 내용은 세무사와 함께 확인해보시는 걸 추천드려요.${lawRef('소득세법 제89조①3호 · 시행령 제154조 · 제155조')}</div>
      </div>`;
  }
  const btn = document.getElementById('ctaBtn');
  btn.textContent = '처음으로 돌아가기';
  btn.className = 'cta-btn secondary';
  btn.onclick = resetAll;
  document.getElementById('bottomCta').style.display = 'block';
}
function goBack() {
  if (document.getElementById('resultScreen').style.display === 'block') {
    document.getElementById('resultScreen').style.display = 'none';
    showQScreen(); return;
  }
  if (inExtra && curQIdx === 0) {
    inExtra = false; curQIdx = TYPES[curType].qs.length - 1; showQScreen(); return;
  }
  if (curQIdx > 0) { curQIdx--; renderQ(); return; }
  resetAll();
}
function resetAll() {
  curType = null; answers = []; inExtra = false; extraAnswers = []; curQIdx = 0;
  document.getElementById('homeScreen').style.display = 'block';
  document.getElementById('qScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('homeBtn').style.display = 'none';
  document.getElementById('topTitle').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('bottomCta').style.display = 'none';
  document.getElementById('progressFill').style.width = '0%';
}
</script>
