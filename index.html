<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>부동산 세금 계산센터</title>
  <style>
    :root {
      --blue:   #3182f6;
      --bg:     #f2f4f6;
      --white:  #ffffff;
      --t1:     #191f28;
      --t2:     #4e5968;
      --t3:     #8b95a1;
      --border: #e5e8eb;
      --shadow: 0 1px 6px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--t1);
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── 헤더 ── */
    .header {
      background: var(--white);
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
      border-bottom: 1px solid var(--border);
      transition: box-shadow .2s;
    }
    .header.scrolled { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .header-logo {
      font-size: 16px; font-weight: 700; color: var(--t1);
      display: flex; align-items: center; gap: 8px;
    }
    .logo-badge {
      width: 28px; height: 28px; background: var(--blue);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }
    .logo-badge svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; }
    .header-menu { display: flex; gap: 2px; }
    .header-menu button {
      background: none; border: none; font-size: 13px; font-weight: 500;
      color: var(--t3); padding: 6px 10px; border-radius: 8px; cursor: pointer;
      font-family: inherit;
    }
    .header-menu button:active { background: var(--bg); }

    /* ── 히어로 (압축) ── */
    .hero {
      background: var(--white);
      padding: 20px 20px 18px;
      margin-bottom: 8px;
    }
    .hero-tag {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--bg); color: var(--t3);
      font-size: 11px; font-weight: 600;
      padding: 4px 10px; border-radius: 100px;
      margin-bottom: 10px;
    }
    .hero-tag .dot { width: 5px; height: 5px; background: var(--blue); border-radius: 50%; }
    .hero h1 {
      font-size: 22px; font-weight: 700; color: var(--t1);
      line-height: 1.35; margin-bottom: 6px; word-break: keep-all;
    }
    .hero p {
      font-size: 13px; color: var(--t2); line-height: 1.55; word-break: keep-all;
    }

    /* ── 섹션 타이틀 ── */
    .section-head { padding: 20px 20px 10px; }
    .section-title { font-size: 15px; font-weight: 700; color: var(--t1); }

    /* ── 카드 리스트 ── */
    .card-list { display: flex; flex-direction: column; gap: 8px; padding: 0 20px 8px; }

    /* ── 그룹 헤더 ── */
    .group-header {
      padding: 16px 20px 6px;
      font-size: 13px; font-weight: 700; color: var(--t3);
      letter-spacing: 0.03em; text-transform: uppercase;
    }
    .group-divider {
      height: 1px; background: var(--border);
      margin: 4px 20px 0;
    }

    .calc-card {
      background: var(--white);
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 14px;
      cursor: pointer;
      transition: transform .13s, box-shadow .13s;
      border: 1px solid transparent;
    }
    .calc-card:active {
      transform: scale(0.982);
      box-shadow: none;
      border-color: var(--border);
    }

    /* 아이콘 */
    .card-icon {
      width: 46px; height: 46px; border-radius: 14px;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }

    /* 텍스트 */
    .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 15px; font-weight: 700; color: var(--t1); margin-bottom: 3px; }
    .card-desc  { font-size: 12px; color: var(--t3); line-height: 1.5; word-break: keep-all; }

    /* 화살표 */
    .card-arrow { flex-shrink: 0; }
    .card-arrow svg { width: 18px; height: 18px; fill: none; stroke: var(--t3); stroke-width: 2; display: block; }

    /* ── 주의 안내 ── */
    .notice-section {
      margin: 4px 20px 8px;
      padding: 14px 16px;
      background: var(--white);
      border-radius: 12px;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .notice-text { font-size: 11px; color: var(--t3); line-height: 1.7; word-break: keep-all; }
    .notice-text strong { color: var(--t2); font-weight: 600; }

    /* ── 상담 섹션 ── */
    .consult-section {
      margin: 0 20px 24px;
      background: var(--blue);
      border-radius: 16px;
      padding: 20px;
      color: #fff;
    }
    .consult-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; word-break: keep-all; }
    .consult-desc  { font-size: 12px; opacity: 0.8; line-height: 1.6; margin-bottom: 16px; word-break: keep-all; }
    .btn-consult {
      width: 100%; padding: 13px;
      background: rgba(255,255,255,0.15);
      color: #fff; border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background .15s;
    }
    .btn-consult:active { background: rgba(255,255,255,0.25); }

  </style>

<style id="tds-base">

<script>
/* 아이폰은 글자 16px 미만 입력창을 누르면 화면을 확대하고, 확대가 그대로 남아 레이아웃이 깨진다.
   16px보다 작은 입력창만 16px로 올린다 (큰 금액 입력창은 그대로). 나중에 생기는 입력창(AI 채팅 등)도 처리. */
(function(){
  var SEL='input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=hidden]),select,textarea';
  function fix(root){
    if(!root||!root.querySelectorAll) return;
    var list=root.matches&&root.matches(SEL)?[root]:[];
    list=list.concat([].slice.call(root.querySelectorAll(SEL)));
    list.forEach(function(el){ if(parseFloat(getComputedStyle(el).fontSize)<16) el.style.setProperty('font-size','16px','important'); });
  }
  function start(){
    fix(document);
    new MutationObserver(function(ms){ ms.forEach(function(m){ [].forEach.call(m.addedNodes,function(n){ if(n.nodeType===1) fix(n); }); }); })
      .observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  /* 혹시 확대된 상태로 남으면 입력이 끝날 때 원래 배율로 되돌린다 */
  document.addEventListener('focusout',function(e){
    if(!e.target.matches||!e.target.matches(SEL)) return;
    var vp=document.querySelector('meta[name=viewport]'); if(!vp||!window.visualViewport||visualViewport.scale<=1.01) return;
    var c=vp.content; vp.content=c+', maximum-scale=1'; setTimeout(function(){ vp.content=c; },300);
  });
})();
</script>

<script>
/* 계산 단계 옆에 붙이는 법령 근거. 사용: lawRef('소득세법 제104조①1호') */
/* 브라우저 alert 대신 토스식 토스트 (alert는 앱 안 iframe에서 화면을 멈추게 함) */
function tdsToast(msg){
  var el=document.getElementById('tds-toast');
  if(!el){ el=document.createElement('div'); el.id='tds-toast';
    el.style.cssText='position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 40px);width:max-content;background:rgba(25,31,40,.92);color:#fff;font-size:15px;font-weight:500;line-height:1.5;padding:13px 20px;border-radius:14px;z-index:99999;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;word-break:keep-all';
    document.body.appendChild(el); }
  el.textContent=String(msg); el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(function(){ el.style.opacity='0'; },2400);
}
function lawRef(t, inline){ return t ? '<span class="law-ref'+(inline?' inline':'')+'">'+t+'</span>' : ''; }
</script>

/* 토스식 질문 넘기기 엔진
   TDSWizard({ title, steps:[{id, q, sub, type:'choice'|'money'|'number'|'multi'|'date'|'search', ...}], onDone(answers), init })
   - choice: options:[{v,l,d}], row:true(가로 2~3개) → 누르면 바로 다음
   - money: unit:'만원'|'원' (값은 그 단위의 숫자) / number: unit, max / multi: fields:[{id,label,unit,max}]
   - date: 'YYYY-MM-DD' / search: suggest(q) → 문자열 배열
   - when(a): false면 건너뜀 / validate(v,a): 오류 문구 / optional: 비워도 다음 / help: 회색 안내 */
(function(){
  var ICON_BACK='<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>';
  var ICON_CK='<svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17 19 7"/></svg>';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function kor(n, unit){
    n=Number(n)||0; if(n<=0) return '';
    var won = unit==='만원' ? n*10000 : n;
    var jo=Math.floor(won/1e12), eok=Math.floor(won%1e12/1e8), man=Math.floor(won%1e8/1e4), rest=Math.round(won%1e4), out=[];
    if(jo) out.push(jo.toLocaleString()+'조'); if(eok) out.push(eok.toLocaleString()+'억'); if(man) out.push(man.toLocaleString()+'만');
    if(!out.length || (rest && unit!=='만원')) out.push((rest||0).toLocaleString());
    return out.join(' ')+' 원';
  }
  function digits(s){ return String(s||'').replace(/[^0-9]/g,''); }
  window.tdsKor = kor;

  window.TDSWizard = function(cfg){
    var a = Object.assign({}, cfg.init||{}), hist=[], idx=0;
    var root=document.createElement('div'); root.className='tds-wiz'; root.id='tds-wiz';
    root.innerHTML='<div class="tds-topbar"><button class="tds-back" aria-label="뒤로">'+ICON_BACK+'</button><div class="tds-topbar-title">'+esc(cfg.title)+'</div></div>'+
      '<div class="tds-progress"><i></i></div><div class="tds-wiz-body"></div>'+
      '<div class="tds-cta-bar"><div><button class="tds-btn" id="tds-next">다음</button></div></div>';
    document.body.appendChild(root); document.documentElement.classList.add('tds-wiz-on');
    var body=root.querySelector('.tds-wiz-body'), bar=root.querySelector('.tds-cta-bar'), next=root.querySelector('#tds-next'), back=root.querySelector('.tds-back');
    var steps=cfg.steps;
    function visible(i){ var s=steps[i]; return !s.when || s.when(a); }
    function nextIdx(i){ for(var j=i+1;j<steps.length;j++) if(visible(j)) return j; return -1; }
    function countVisible(){ var n=0,pos=0; for(var j=0;j<steps.length;j++){ if(visible(j)){ n++; if(j<=idx) pos=n; } } return [pos,n]; }
    function err(msg){ var e=body.querySelector('.tds-err'); if(e) e.textContent=msg||''; var w=body.querySelector('.tds-input-wrap'); if(w) w.classList.toggle('err',!!msg); }
    function value(s){
      if(s.type==='multi'){ var o={}; s.fields.forEach(function(f){ o[f.id]=Number(digits(body.querySelector('[data-f="'+f.id+'"]').value))||0; }); return o; }
      var el=body.querySelector('.tds-input'); if(!el) return a[s.id];
      if(s.type==='money'||s.type==='number') return el.value===''?null:Number(digits(el.value));
      return el.value.trim();
    }
    function empty(s,v){ if(s.type==='multi') return false; return v===null||v===undefined||v===''; }
    function go(){
      var s=steps[idx], v=value(s);
      if(s.type!=='choice'){
        if(empty(s,v) && !s.optional){ err(s.type==='date'?'날짜를 선택해 주세요':'값을 입력해 주세요'); return; }
        if(s.validate){ var m=s.validate(v,a); if(m){ err(m); return; } }
        a[s.id]=empty(s,v)?(s.type==='money'||s.type==='number'?0:''):v;
        if(s.type==='multi') s.fields.forEach(function(f){ a[f.id]=v[f.id]; });
      }
      var n=nextIdx(idx);
      if(n<0){ finish(); return; }
      hist.push(idx); idx=n; render();
    }
    function finish(){
      root.remove(); document.documentElement.classList.remove('tds-wiz-on'); window.scrollTo(0,0);
      cfg.onDone(a);
    }
    function render(){
      var s=steps[idx], c=countVisible(); err('');
      root.querySelector('.tds-progress i').style.width=Math.round(c[0]/c[1]*100)+'%';
      back.classList.toggle('home', hist.length===0);
      var h='<div class="tds-step-count">'+c[0]+' / '+c[1]+'</div><h2 class="tds-q">'+esc(typeof s.q==='function'?s.q(a):s.q)+'</h2><p class="tds-q-sub">'+esc(typeof s.sub==='function'?s.sub(a):(s.sub||''))+'</p><div class="tds-control">';
      var cur=a[s.id];
      if(s.type==='choice'){
        h+='<div class="tds-choices'+(s.row?' row':'')+'">'+s.options.filter(function(o){return !o.when||o.when(a);}).map(function(o){
          return '<button class="tds-choice'+(cur===o.v?' on':'')+'" data-v="'+esc(o.v)+'"><span><span class="t">'+esc(o.l)+'</span>'+(o.d?'<span class="d">'+esc(o.d)+'</span>':'')+'</span><span class="ck">'+ICON_CK+'</span></button>';
        }).join('')+'</div>';
      } else if(s.type==='multi'){
        h+='<div class="tds-multi">'+s.fields.map(function(f){ var v=a[f.id];
          return '<div><div class="tds-input-wrap"><input class="tds-input" data-f="'+f.id+'" inputmode="numeric" placeholder="0" value="'+(v||v===0?v:'')+'"><span class="tds-unit">'+esc(f.unit||'')+'</span></div></div>'; }).join('')+'</div>';
      } else {
        var type = s.type==='date'?'date':'text', im = (s.type==='money'||s.type==='number')?' inputmode="numeric"':'';
        var val = cur==null||cur===''?'':(s.type==='money'?Number(cur).toLocaleString():cur);
        h+='<div class="tds-input-wrap"><input class="tds-input" type="'+type+'"'+im+' autocomplete="off" enterkeyhint="next" placeholder="'+esc(s.placeholder||(s.type==='money'?'0':''))+'" value="'+esc(val)+'"'+(s.max?' max="'+s.max+'"':'')+'>'+(s.unit?'<span class="tds-unit">'+esc(s.unit)+'</span>':'')+'</div>';
        if(s.type==='money') h+='<div class="tds-hint"></div>';
        if(s.type==='search') h+='<div class="tds-suggest"></div>';
      }
      h+='<div class="tds-err"></div>'+(s.help?'<div class="tds-help">'+esc(typeof s.help==='function'?s.help(a):s.help)+'</div>':'')+'</div>';
      body.innerHTML=h; body.scrollTop=0;
      bar.style.display = s.type==='choice' ? 'none' : '';
      next.textContent = nextIdx(idx)<0 ? (cfg.doneLabel||'결과 보기') : '다음';
      if(s.type==='choice'){
        body.querySelectorAll('.tds-choice').forEach(function(b){ b.onclick=function(){
          body.querySelectorAll('.tds-choice').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
          var raw=b.getAttribute('data-v'), o=s.options.find(function(x){return String(x.v)===raw;}); a[s.id]=o?o.v:raw;
          setTimeout(go,160);
        }; });
        return;
      }
      var inp=body.querySelector('.tds-input');
      if(s.type==='money'){
        var hint=body.querySelector('.tds-hint');
        var upd=function(){ var d=digits(inp.value); inp.value=d?Number(d).toLocaleString():''; hint.textContent=kor(d,s.unit); };
        inp.addEventListener('input',upd); upd();
      }
      if(s.type==='search'){
        var box=body.querySelector('.tds-suggest');
        var show=function(){ var q=inp.value.trim(); var list=q?(s.suggest(q)||[]).slice(0,8):[];
          box.innerHTML=list.map(function(t){ var i=t.indexOf(q); return '<button type="button">'+(i>=0?esc(t.slice(0,i))+'<b>'+esc(q)+'</b>'+esc(t.slice(i+q.length)):esc(t))+'</button>'; }).join('');
          box.querySelectorAll('button').forEach(function(b,i){ b.onclick=function(){ inp.value=list[i]; box.innerHTML=''; go(); }; }); };
        inp.addEventListener('input',show);
      }
      body.querySelectorAll('.tds-input').forEach(function(el){ el.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); go(); } }); });
      if(s.type!=='date' && !('ontouchstart' in window)) setTimeout(function(){ inp && inp.focus(); },50);
    }
    next.onclick=go;
    back.onclick=function(){
      if(hist.length){ idx=hist.pop(); render(); return; }
      if(cfg.onExit) cfg.onExit(); else if(window.self===window.top) location.href='index.html';
    };
    function lift(){ if(!window.visualViewport) return; var off=Math.max(0, window.innerHeight-visualViewport.height-visualViewport.offsetTop); bar.style.transform=off>0?'translateY('+(-off)+'px)':''; }
    if(window.visualViewport){ visualViewport.addEventListener('resize',lift); visualViewport.addEventListener('scroll',lift); }
    render();
    return { answers:a, restart:function(){ window.TDSWizard(cfg); } };
  };

  /* 결과 화면 상단바 + 하단 '다시 계산하기' 를 붙인다 */
  window.tdsResultChrome = function(container, title, restart){
    if(!container) return;
    var old=container.querySelector(':scope > .tds-result-head'); if(old) old.remove();
    var head=document.createElement('div'); head.className='tds-result-head';
    head.innerHTML='<div class="tds-topbar" style="margin:0 -20px 8px;padding:0 4px"><button class="tds-back" aria-label="다시 계산">'+ICON_BACK+'</button><div class="tds-topbar-title">'+esc(title)+'</div></div>';
    head.querySelector('.tds-back').onclick=restart;
    container.insertBefore(head, container.firstChild);
    var oldA=container.querySelector(':scope > .tds-result-actions'); if(oldA) oldA.remove();
    var act=document.createElement('div'); act.className='tds-result-actions';
    act.innerHTML='<button class="tds-btn sub">다시 계산하기</button>'+(window.self===window.top?'<button class="tds-btn sub">다른 계산기</button>':'');
    act.children[0].onclick=restart; if(act.children[1]) act.children[1].onclick=function(){ location.href='index.html'; };
    container.appendChild(act);
  };
})();
</script>
<!-- TDS:END -->
</head>
<body>

<!-- 헤더 -->
<header class="header" id="header">
  <div class="header-logo">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    세금 계산센터
  </div>
  <div class="header-menu">
    <button onclick="location.href='consulting.html'">문의</button>
  </div>
</header>

<!-- 히어로 -->
<section class="hero">
  <div class="hero-tag"><div class="dot"></div>부동산 세금 계산기</div>
  <h1>복잡한 부동산 세금,<br>쉽게 계산하세요</h1>
  <p>취득세, 증여세, 상속세, 양도세를 한곳에서 확인해요.</p>
</section>

<!-- 카드 섹션 -->
<div class="section-head">
  <div class="section-title">계산기 선택</div>
</div>
<div class="card-list" id="card-list"></div>

<!-- 주의 문구 -->
<div class="notice-section">
  <div class="notice-text">
    <strong>참고용 계산 결과입니다.</strong> 실제 세액은 보유 조건, 지역, 주택 수, 세법 개정에 따라 달라질 수 있어요.
  </div>
</div>

<!-- 상담 섹션 -->
<div class="consult-section">
  <div class="consult-title">정확한 검토가 필요하신가요?</div>
  <div class="consult-desc">계산 결과를 바탕으로 전문가 상담을 연결해 드립니다.</div>
  <button class="btn-consult" onclick="location.href='consulting.html'">상담 문의하기</button>
</div>


<script>
const CALCULATORS = [
  {
    icon: '🏠',
    title: '취득세 계산기',
    desc: '부동산을 살 때 내야 할 세금',
    link: 'acquisition.html',
    group: null,
  },
  {
    icon: '🎁',
    title: '증여세 계산기',
    desc: '부동산을 증여할 때 예상 세금',
    link: 'gift.html',
    group: null,
  },
  {
    icon: '📋',
    title: '상속세 계산기',
    desc: '상속 재산 기준 예상 세금',
    link: 'inheritance.html',
    group: null,
  },
  {
    icon: '📈',
    title: '양도세 — 주택 (일반)',
    desc: '1주택·다주택 양도소득세 계산',
    link: 'capital_gains_tax.html',
    group: '양도세',
  },
  {
    icon: '🏘️',
    title: '양도세 — 1세대2주택 비과세',
    desc: '일시적 2주택 등 비과세 요건 판정',
    link: 'capital_gains_2house_exempt.html',
    group: '양도세',
  },
  {
    icon: '🔨',
    title: '양도세 — 재건축·재개발',
    desc: '1세대1주택 재건축·재개발 양도세',
    link: 'capital_gains_rebuild.html',
    group: '양도세',
  },
  {
    icon: '🏢',
    title: '양도세 — 주택 외 (상가·빌딩)',
    desc: '상가, 빌딩 등 주택 외 부동산 양도세',
    link: 'capital_gains_non_housing.html',
    group: '양도세',
  },
  {
    icon: '🏗️',
    title: '양도세 — 법인 부동산',
    desc: '법인이 부동산 양도 시 법인세 계산',
    link: 'capital_gains_corporate.html',
    group: '양도세',
  },
  {
    icon: '📍',
    title: '양도세 — 조정지역 사전진단',
    desc: '조정/비조정 지역 여부 및 세율 사전 확인',
    link: 'capital_gains_zone_check.html',
    group: '양도세',
  },
];

const list = document.getElementById('card-list');
let lastGroup = null;

CALCULATORS.forEach(calc => {
  // 그룹 헤더 삽입
  if (calc.group && calc.group !== lastGroup) {
    // 그룹 헤더를 card-list 바깥에 삽입
    const divider = document.createElement('div');
    divider.className = 'group-divider';
    list.parentNode.insertBefore(divider, list);

    const gh = document.createElement('div');
    gh.className = 'group-header';
    gh.textContent = '양도소득세';
    list.parentNode.insertBefore(gh, list);

    // 새 card-list 시작
    const newList = document.createElement('div');
    newList.className = 'card-list';
    list.parentNode.insertBefore(newList, list.nextSibling);
    // 이후 카드는 newList에 추가
    list.parentNode._yangdoseList = newList;
    lastGroup = calc.group;
  }

  const targetList = (calc.group && list.parentNode._yangdoseList) ? list.parentNode._yangdoseList : list;

  const card = document.createElement('div');
  card.className = 'calc-card';
  card.innerHTML = `
    <div class="card-icon">${calc.icon}</div>
    <div class="card-body">
      <div class="card-title">${calc.title}</div>
      <div class="card-desc">${calc.desc}</div>
    </div>
    <div class="card-arrow">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  `;
  card.addEventListener('click', () => {
    if (location.protocol === 'file:') {
      showToast('Netlify 배포 후 정상 작동합니다');
      return;
    }
    location.href = calc.link;
  });
  targetList.appendChild(card);
});

function showToast(msg) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#191f28;color:#fff;font-size:13px;font-weight:600;padding:12px 20px;border-radius:12px;z-index:999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.2);transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 3000);
}

window.addEventListener('scroll', () => {
  document.getElementById('header').classList.toggle('scrolled', window.scrollY > 4);
});
</script>
