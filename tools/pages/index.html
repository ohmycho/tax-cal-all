<style id="tds-page">
.hero h1{font-size:26px!important}
.hero p{font-size:16px!important}
.section-title{font-size:18px!important}
.card-title{font-size:17px!important;font-weight:600!important}
.card-desc{font-size:14px!important;color:#6b7684!important}
.notice-text{font-size:13px!important}
.hero-tag{font-size:13px!important}
.group-header{font-size:15px!important;color:#4e5968!important;padding-top:20px!important}
.consult-title{font-size:18px!important}
.consult-desc{font-size:15px!important}
.btn-consult{font-size:16px!important}
.tds-hub-ver{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:#f2f4f6;border-radius:10px;padding:8px 12px;font-size:14px;color:#4e5968}
.tds-hub-ver b{color:#3182f6;font-weight:700}
.tds-hub-ver span{font-size:14px}
/* 바탕화면·홈 화면에 추가 안내 */
.tds-install{margin:12px 16px 4px;background:#fff;border-radius:20px;box-shadow:inset 0 0 0 2px #3182f6;padding:18px 18px 16px}
.tds-install .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px}
.tds-install h3{font-size:18px;font-weight:700;margin:0;color:#191f28}
.tds-install .fold{flex:none;border:0;background:#e8f3ff;color:#1b64da;font-size:14px;font-weight:700;border-radius:999px;padding:7px 12px;cursor:pointer}
.tds-install.folded{padding-bottom:18px}
.tds-install.folded .head{margin:0}
.tds-install .lead{font-size:15px;color:#4e5968;margin:0 0 12px;line-height:1.5}
.tds-install .url{display:flex;align-items:center;gap:8px;background:#f2f4f6;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.tds-install .url code{flex:1;min-width:0;font-family:inherit;font-size:15px;font-weight:600;color:#1b64da;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tds-install .url button{border:0;background:#3182f6;color:#fff;font-size:14px;font-weight:600;border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tds-install .tabs{display:flex;background:#f2f4f6;border-radius:12px;padding:4px;margin-bottom:12px}
.tds-install .tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 0;font-size:15px;font-weight:600;color:#6b7684;cursor:pointer}
.tds-install .tabs button.on{background:#fff;color:#191f28;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tds-install .os{font-size:15px;font-weight:700;color:#191f28;margin:10px 0 6px}
.tds-install ol{margin:0;padding-left:20px;font-size:15px;line-height:1.7;color:#333d4b}
.tds-install ol b{color:#191f28}
.tds-install .tip{font-size:14px;color:#6b7684;background:#f9fafb;border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.55}
.embedded .tds-install{display:none}
@media (display-mode: standalone){ .tds-install{display:none} }
</style>

<script>
(function(){
  var URL_='https://tax-cal-all.netlify.app';
  var isPhone=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  var box=document.createElement('section'); box.className='tds-install'; box.id='install-guide';
  box.innerHTML=
    '<div class="head"><h3>📌 바탕화면·홈 화면에 추가</h3><button type="button" class="fold" id="fold-guide">접기 ▲</button></div>'+
    '<p class="lead">아래 주소를 저장해 두면 앱처럼 바로 열 수 있어요.</p>'+
    '<div class="url"><code>'+URL_.replace('https://','')+'</code><button type="button" id="copy-url">주소 복사</button></div>'+
    '<div class="tabs"><button type="button" data-t="phone">휴대폰</button><button type="button" data-t="pc">PC</button></div>'+
    '<div data-p="phone">'+
      '<div class="os">아이폰 (사파리)</div><ol>'+
        '<li>사파리로 이 주소를 열어요</li>'+
        '<li>아래쪽 <b>공유 버튼</b>(네모에 위쪽 화살표)을 눌러요</li>'+
        '<li><b>홈 화면에 추가</b> → 오른쪽 위 <b>추가</b></li></ol>'+
      '<div class="os">안드로이드 (크롬·삼성 인터넷)</div><ol>'+
        '<li>크롬으로 이 주소를 열어요</li>'+
        '<li>오른쪽 위 <b>⋮</b> 메뉴를 눌러요 (삼성 인터넷은 아래쪽 <b>≡</b>)</li>'+
        '<li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b> → <b>추가</b></li></ol>'+
      '<div class="tip">카카오톡에서 열었다면 오른쪽 아래(또는 위) <b>⋯</b> → <b>다른 브라우저로 열기</b>를 먼저 눌러 주세요.</div>'+
    '</div>'+
    '<div data-p="pc">'+
      '<div class="os">크롬 · 엣지 (윈도우·맥)</div><ol>'+
        '<li>주소창 오른쪽의 <b>설치</b> 아이콘(모니터 모양)을 눌러요</li>'+
        '<li><b>설치</b>를 누르면 바탕화면과 시작 메뉴에 아이콘이 생겨요</li></ol>'+
      '<div class="tip">설치 아이콘이 안 보이면 크롬은 <b>⋮ → 전송, 저장, 공유 → 바로가기 만들기</b>(‘창으로 열기’ 체크), 엣지는 <b>⋯ → 앱 → 이 사이트를 앱으로 설치</b>를 눌러요.</div>'+
      '<div class="os">맥 사파리</div><ol><li>메뉴 막대 <b>파일 → Dock에 추가</b></li></ol>'+
      '<div class="os">어떤 브라우저든</div><ol><li>주소창 왼쪽 <b>자물쇠(또는 ⓘ) 아이콘</b>을 바탕화면으로 끌어다 놓아요</li></ol>'+
    '</div>'+
    '';
  var anchor=document.querySelector('.hero'); if(!anchor) return;
  anchor.parentNode.insertBefore(box, anchor);
  function show(t){ box.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-t')===t); });
    box.querySelectorAll('[data-p]').forEach(function(d){ d.style.display = d.getAttribute('data-p')===t ? '' : 'none'; }); }
  box.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){ show(b.getAttribute('data-t')); }; });
  show(isPhone?'phone':'pc');
  document.getElementById('copy-url').onclick=function(){
    var done=function(){ tdsToast('주소를 복사했어요'); };
    if(navigator.clipboard) navigator.clipboard.writeText(URL_).then(done, function(){ tdsToast(URL_); });
    else tdsToast(URL_);
  };
  var body=[].slice.call(box.children).filter(function(el){ return !el.classList.contains('head'); });
  var fb=document.getElementById('fold-guide');
  function setFold(f){ box.classList.toggle('folded', f); body.forEach(function(el){ el.style.display = f ? 'none' : ''; });
    if(!f) show(box.querySelector('.tabs .on').getAttribute('data-t'));
    fb.textContent = f ? '펼치기 ▼' : '접기 ▲'; try{ localStorage.setItem('tdsInstallFolded', f?'1':'0'); }catch(e){} }
  var saved=null; try{ saved=localStorage.getItem('tdsInstallFolded'); }catch(e){}
  setFold(saved==='1');
  fb.onclick=function(){ setFold(!box.classList.contains('folded')); };
})();
</script>
