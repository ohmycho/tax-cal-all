<style id="tds-page">
#landing-screen,.restart-wrap,.home-top-btn{display:none!important}
body{background:#f2f4f6!important;padding:0 0 48px!important}
#main-calc{padding:0 16px!important;max-width:560px!important}
.result-card{border:0!important;box-shadow:none!important;border-radius:20px!important}
.result-top{background:#fff!important;color:#191f28!important;text-align:left!important;padding:28px 24px 8px!important}
.result-top-label{font-size:15px!important;font-weight:600!important;color:#6b7684!important}
.result-total-num{font-size:32px!important;color:#191f28!important;letter-spacing:-0.02em!important}
.result-meta{justify-content:flex-start!important}
.meta-badge{background:#f2f4f6!important;color:#4e5968!important;font-size:13px!important}
.meta-badge.hi{background:#e8f3ff!important;color:#1b64da!important;font-weight:600}
.result-card [style*="padding:10px 0;border-bottom"]{padding:14px 0!important}
.result-card [style*="flex:1;font-size:14px"]{font-size:16px!important}
.result-card [style*="font-size:14px;font-weight:700;color:"]{font-size:17px!important;font-weight:600!important}
.result-actions .action-btn{height:52px;min-height:52px!important;font-size:15px!important;white-space:nowrap;padding:0 12px!important}
.result-actions .action-btn[style*="#191F28"]{background:#f2f4f6!important;color:#333d4b!important}
#main-calc > div > button[style*="var(--toss-blue)"]{height:56px;font-size:17px!important;font-weight:600!important;border-radius:16px!important}
</style>
<script>
(function(){
  var last = {};
  var YN=[{v:true,l:'네'},{v:false,l:'아니요'}];
  var kid=function(a){ return a.target==='child'||a.target==='grand'; };
  function start(){
    document.getElementById('main-calc').classList.add('hidden');
    TDSWizard({
      title:'증여세 계산기', init:last,
      steps:[
        { id:'target', type:'choice', q:'누구에게 주시나요?', sub:'받는 사람과의 관계에 따라 공제 한도가 달라요.',
          options:[{v:'spouse',l:'배우자',d:'10년간 6억 원까지 공제'},{v:'child',l:'자녀',d:'성인 5천만 원 · 미성년 2천만 원 공제'},
                   {v:'grand',l:'손주',d:'공제는 같고 세금 30% 할증 (세대생략)'},{v:'parent',l:'부모·조부모',d:'5천만 원 공제'},
                   {v:'other',l:'그 외 친족',d:'형제·자매·사위·며느리 등 · 1천만 원 공제'}] },
        { id:'isMinor', type:'choice', q:'받는 사람이 미성년자인가요?', sub:'만 19세 미만이면 공제 한도가 2천만 원이에요.', when:kid, options:YN, row:true },
        { id:'assetValue', type:'money', unit:'만원', q:'얼마를 주시나요?', sub:'부동산은 시가(실거래가·KB시세) 기준으로 입력해 주세요.',
          validate:function(v){ return v>0?'':'금액을 입력해 주세요'; } },
        { id:'hasDebt', type:'choice', q:'받는 사람이 떠안는\n빚이 있나요?', sub:'대출이나 전세보증금이 낀 부동산을 주는 경우(부담부증여)예요.', options:YN, row:true },
        { id:'debtAmount', type:'money', unit:'만원', q:'떠안는 빚은 얼마인가요?', when:function(a){return a.hasDebt;},
          validate:function(v,a){ return v<=0?'금액을 입력해 주세요':(v>=a.assetValue?'주는 금액보다 작아야 해요':''); } },
        { id:'isMarriage', type:'choice', q:'혼인·출산 공제 대상인가요?', when:kid,
          sub:'최대 1억 원을 더 공제받을 수 있어요. (상증법 제53조의2)',
          help:'· 혼인: 혼인신고일 2년 전부터 2년 후까지 받은 증여\n· 출산·입양: 출생일·입양신고일부터 2년 안에 받은 증여',
          options:[{v:true,l:'네, 해당해요'},{v:false,l:'아니요'}] },
        { id:'priorMarriageDeduct', type:'money', unit:'만원', q:'혼인·출산 공제를 전에\n받은 적이 있나요?', sub:'혼인·출산 공제는 평생 합쳐 1억 원까지예요. 받은 적 없으면 비워 두세요.', optional:true,
          when:function(a){return kid(a)&&a.isMarriage;}, validate:function(v){ return v>10000?'최대 1억 원(10,000만원)까지예요':''; } },
        { id:'hasPrior', type:'choice', q:'최근 10년 안에 같은 분께\n받은 적이 있나요?', sub:'10년 안에 받은 금액은 합쳐서 세금을 계산해요. 부모님처럼 부부는 한 사람으로 봐요.', options:YN, row:true },
        { id:'priorGift', type:'money', unit:'만원', q:'그때 받은 금액은\n모두 얼마인가요?', when:function(a){return a.hasPrior;}, validate:function(v){ return v>0?'':'금액을 입력해 주세요'; } },
        { id:'priorMarriageInPrior', type:'choice', q:'전에 받은 혼인·출산 공제가\n이 10년 안 증여에서 받은 건가요?',
          sub:'같은 분께 10년 안에 받은 증여에서 혼인·출산 공제를 썼다면, 합쳐서 계산할 때도 그 공제를 다시 빼 줘요.',
          when:function(a){return kid(a)&&a.hasPrior&&a.isMarriage&&(a.priorMarriageDeduct||0)>0;}, options:YN, row:true },
        { id:'priorDeduct', type:'money', unit:'만원', q:'그때 공제받은 금액을\n아시나요?', sub:'혼인·출산 공제는 빼고 기본 증여재산공제만 적어 주세요. 모르면 비워 두세요. 한도를 모두 쓴 것으로 계산해요.', optional:true, when:function(a){return a.hasPrior;} },
        { id:'assetKind', type:'choice', q:'무엇을 주시나요?', sub:'부동산이면 받는 분이 내는 취득세도 같이 계산해 드려요.',
          options:[{v:'house',l:'주택',d:'아파트·빌라·단독주택'},{v:'other',l:'주택 외 부동산',d:'상가·토지·오피스텔 등'},{v:'cash',l:'현금·주식 등',d:'취득세 없음'}] },
        { id:'small85', type:'choice', q:'전용면적이 85㎡ 이하인가요?', sub:'85㎡ 이하 주택은 농어촌특별세가 없어요.', when:function(a){return a.assetKind==='house';}, options:YN, row:true },
        { id:'zone', type:'choice', q:'조정대상지역에 있나요?', sub:'증여받는 날 기준이에요.', when:function(a){return a.assetKind==='house';}, options:YN, row:true },
        { id:'over3', type:'choice', q:'공시가격이 3억 원 이상인가요?', sub:'조정대상지역의 공시가격(시가표준액) 3억 원 이상 주택은 취득세가 12%로 무거워질 수 있어요.',
          when:function(a){return a.assetKind==='house'&&a.zone;}, options:YN, row:true },
        { id:'giverOne', type:'choice', q:'주시는 분이\n1세대 1주택자인가요?', sub:'1세대 1주택자가 배우자·직계가족에게 주면 12% 대신 3.5%예요.',
          when:function(a){return a.assetKind==='house'&&a.zone&&a.over3&&a.target!=='other';}, options:YN, row:true },
        { id:'houseN', type:'choice', q:'받은 뒤 받는 분 세대의\n주택은 모두 몇 채인가요?', sub:'떠안는 빚 부분은 집을 산 것(유상취득)으로 봐서 주택 수에 따라 세율이 달라져요.',
          when:function(a){return a.assetKind==='house'&&a.hasDebt;},
          options:[{v:1,l:'1주택'},{v:2,l:'2주택'},{v:3,l:'3주택'},{v:4,l:'4주택 이상'}] },
        { id:'onTime', type:'choice', q:'기한 안에 신고하실 건가요?', sub:'받은 달의 말일부터 3개월 안에 신고하면 세금을 3% 줄여 줘요.',
          options:[{v:true,l:'네, 기한 안에 신고할게요'},{v:false,l:'아니요'}] }
      ],
      onDone:function(a){
        last=a;
        var rel={spouse:'spouse',child:'lineal-down',grand:'lineal-down',parent:'lineal-up',other:'other'}[a.target];
        Object.assign(userData,{ target:a.target, relation:rel, isGrand:a.target==='grand', isMinor:kid(a)&&!!a.isMinor,
          isMarriage:kid(a)&&!!a.isMarriage, priorMarriageDeduct:(kid(a)&&a.isMarriage)?Math.min(10000,a.priorMarriageDeduct||0):0,
          assetValue:a.assetValue, debtAmount:a.hasDebt?a.debtAmount:0, priorGift:a.hasPrior?a.priorGift:0,
          priorDeductUsed:(a.hasPrior&&a.priorDeduct!=null)?a.priorDeduct:null /* 0원 입력은 0, 비우면 null(추정) */, onTime:a.onTime!==false,
          priorMarriageInPrior: kid(a)&&a.hasPrior&&a.isMarriage&&(a.priorMarriageDeduct||0)>0&&!!a.priorMarriageInPrior,
          assetKind:a.assetKind||'cash', small85:a.assetKind==='house'&&!!a.small85, zone:a.assetKind==='house'&&!!a.zone,
          zone3:a.assetKind==='house'&&!!a.zone&&!!a.over3, houseN:(a.assetKind==='house'&&a.hasDebt)?(a.houseN||1):1,
          giverOne:a.assetKind==='house'&&!!a.zone&&!!a.over3&&a.target!=='other'&&!!a.giverOne });
        document.getElementById('landing-screen').classList.add('hidden');
        var mc=document.getElementById('main-calc'); mc.classList.remove('hidden');
        var r=calcGiftFromUserData(userData);
        document.getElementById('calc-result-host').innerHTML=renderGiftResult(r,userData);
        tdsResultChrome(mc, '증여세 계산 결과', start);
        window.scrollTo(0,0);
      }
    });
  }
  start();
})();
</script>
