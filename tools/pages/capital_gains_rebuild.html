<style id="tds-page">
@@RESULT_CSS@@
#taxBaseFormula{font-size:14px!important;line-height:1.7!important;color:#4e5968!important}
#regulated-badge > div{font-size:15px!important;border-radius:16px!important}
#regulated-badge > div[style*="border:1px solid"]{background:#fff!important;border:0!important;border-radius:20px!important;padding:22px 24px!important;margin-bottom:12px}
#regulated-badge div[style*="font-size:12px"]{font-size:14px!important;line-height:1.8!important}
#regulated-badge div[style*="font-size:13px"]{font-size:15px!important}
</style>
<script>
(function(){
  var last = { houseCount:'1', hasApproval:true, payType:'add' };
  function ym(from, to){ // 두 날짜 사이 [년, 개월]
    if(!from||!to) return [0,0];
    var a=from.split('-').map(Number), b=to.split('-').map(Number);
    var m=(b[0]-a[0])*12+(b[1]-a[1])-(b[2]<a[2]?1:0); m=Math.max(0,m);
    return [Math.floor(m/12), m%12];
  }
  function set(id,v){ var el=document.getElementById(id); if(el) el.value=v; }
  function money(id,v){ set(id, v ? Number(v).toLocaleString('ko-KR') : ''); }
  function start(){
    TDSWizard({
      title:'재건축·재개발 양도세', init:last,
      steps:[
        { id:'houseCount', type:'choice', q:'지금 집이 몇 채인가요?', sub:'이 계산기는 1세대 1주택 비과세·고가주택 계산용이에요.',
          options:[{v:'1',l:'1세대 1주택'},{v:'1temp',l:'일시적 2주택',d:'이사 등으로 잠시 2주택이 된 경우'}] },
        { id:'region', type:'search', q:'집이 어디에 있나요?', sub:'시·군·구 또는 동 이름으로 찾아 주세요.', placeholder:'예: 강남구, 반포동',
          suggest:function(q){ return REGIONS.filter(function(r){ return r.indexOf(q)>=0; }); },
          validate:function(v){ return REGIONS.indexOf(v)>=0 ? '' : '목록에서 지역을 골라 주세요'; } },
        { id:'acqDate', type:'date', q:'처음 집을 언제 샀나요?', sub:'재건축 전 종전주택의 취득일(잔금일)이에요.' },
        { id:'saleDate', type:'date', q:'언제 파나요?', sub:'잔금일 기준이에요.',
          validate:function(v,a){ return v<=a.acqDate ? '취득일보다 뒤 날짜를 선택해 주세요' : ''; } },
        { id:'acqPrice', type:'money', unit:'만원', q:'처음 살 때 얼마였나요?', validate:function(v){ return v>0?'':'금액을 입력해 주세요'; } },
        { id:'salePrice', type:'money', unit:'만원', q:'얼마에 파나요?', validate:function(v){ return v>0?'':'금액을 입력해 주세요'; } },
        { id:'hasApproval', type:'choice', q:'관리처분계획인가를\n받은 집인가요?', sub:'재건축·재개발로 조합원 입주권이나 새 아파트가 된 경우예요.',
          options:[{v:true,l:'네, 인가를 받았어요'},{v:false,l:'아니요, 일반 양도예요'}] },
        { id:'approvalDate', type:'date', q:'관리처분계획인가일은\n언제인가요?', when:function(a){return a.hasApproval;},
          validate:function(v,a){ return (v<=a.acqDate||v>=a.saleDate) ? '취득일과 양도일 사이 날짜를 선택해 주세요' : ''; } },
        { id:'rightValue', type:'money', unit:'만원', q:'조합원 권리가액은\n얼마인가요?', sub:'관리처분계획인가서에 적힌 종전자산 평가액이에요.',
          when:function(a){return a.hasApproval;}, validate:function(v){ return v>0?'':'금액을 입력해 주세요'; } },
        { id:'payType', type:'choice', q:'분담금을 냈나요,\n환급금을 받았나요?', when:function(a){return a.hasApproval;},
          options:[{v:'add',l:'추가분담금을 냈어요'},{v:'refund',l:'환급금을 받았어요'},{v:'none',l:'둘 다 없어요'}] },
        { id:'payment', type:'money', unit:'만원', q:function(a){ return a.payType==='add'?'추가분담금은 얼마인가요?':'환급금은 얼마인가요?'; },
          when:function(a){return a.hasApproval&&a.payType!=='none';}, validate:function(v){ return v>0?'':'금액을 입력해 주세요'; } },
        { id:'live', type:'multi', q:'그 집에 모두\n얼마나 살았나요?', sub:'종전주택과 새 아파트에 산 기간을 합쳐 주세요.',
          fields:[{id:'liveY',label:'년',unit:'년'},{id:'liveM',label:'개월',unit:'개월'}],
          validate:function(v){ return v.liveM>11 ? '개월은 11 이하로 입력해 주세요' : ''; } },
        { id:'after', type:'multi', q:'새 아파트에서는\n얼마나 살았나요?', sub:'준공 후 신축주택에 산 기간이에요. 없으면 0으로 두세요.', when:function(a){return a.hasApproval;},
          fields:[{id:'afterY',label:'년',unit:'년'},{id:'afterM',label:'개월',unit:'개월'}],
          validate:function(v,a){ return v.afterM>11 ? '개월은 11 이하로 입력해 주세요' : ((v.afterY*12+v.afterM)>((a.liveY||0)*12+(a.liveM||0)) ? '전체 거주기간보다 길 수 없어요' : ''); } }
      ],
      onDone:function(a){
        last=a;
        set('houseCount', a.houseCount); set('regionInput', a.region);
        set('oldAcquireDate', a.acqDate); set('saleDate', a.saleDate);
        money('oldAcquirePrice', a.acqPrice); money('salePrice', a.salePrice);
        var ap = a.hasApproval;
        set('approvalDate', ap ? a.approvalDate : '');
        money('rightValue', ap ? a.rightValue : 0);
        money('additionalPayment', ap && a.payType==='add' ? a.payment : 0);
        money('refundPayment', ap && a.payType==='refund' ? a.payment : 0);
        var t=ym(a.acqDate,a.saleDate), p=ap?ym(a.approvalDate,a.saleDate):[0,0];
        set('totalHoldYears',t[0]); set('totalHoldMonths',t[1]); set('postHoldYears',p[0]); set('postHoldMonths',p[1]);
        set('totalLiveYears',a.liveY||0); set('totalLiveMonths',a.liveM||0);
        set('afterLiveYears',ap?(a.afterY||0):0); set('afterLiveMonths',ap?(a.afterM||0):0);
        updateRegionBadge(); calculateTax();
        tdsResultChrome(document.getElementById('result'), '재건축·재개발 양도세 결과', start);
      }
    });
  }
  start();
})();
</script>
